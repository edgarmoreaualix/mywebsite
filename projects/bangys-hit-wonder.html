<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangy’s Hit Wonder</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bangy-page">
  <main>
    <h1 class="project-title bangy-title">Bangy’s Hit Wonder</h1>

    <audio
  id="bangy-audio"
  src="/projects/audios/BangyBangerTender.mp3"
  autoplay
  loop
  muted> 
    </audio>
    <script>
  const audio = document.getElementById("bangy-audio");

  const enableSound = () => {
    audio.muted = false;
    audio.play();
    document.removeEventListener("click", enableSound);
  };

  document.addEventListener("click", enableSound);
</script>

    <img
      src="/projects/images/Bangys-Hit-Wonder.png"
      alt="Bangy’s Hit Wonder central artwork"
      class="bangy-image"
    />

  </main>
</body>
</html>
